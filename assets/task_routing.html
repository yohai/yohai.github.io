<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>תכנון דינמי: מילוי הטבלה</title>
<!--
  Standalone class demo (no Marp): the assembly-line DP on a fixed instance (n=5, four
  station columns). Steps through the table fill right-to-left, showing the two candidate
  edges and the min formula for each cell, the stored choice, and finally the
  reconstruction of the optimal path from the stored choices.
  Keys: → / space / enter = next, ← / backspace = previous, Home = restart.
  Deep link: #step=12 opens at a given step.
  Weights are hard-coded below (checked: no ties in any min). Optimal path
  s→u1→d2→u3→u4→f, cost 12; all nine table values and p* are distinct.
-->
<style>
  :root { --navy:#16325c; --gold:#c8a44d; --gold-bg:#f6ecd2; --red:#b23b3b; --gray:#c9ccd1; --ink:#1c1c1c; --muted:#6b7280; }
  html, body { margin:0; background:#fff; color:var(--ink); font-family: "Helvetica Neue", Arial, "Noto Sans Hebrew", sans-serif; }
  body { padding: 14px 28px; }
  h1 { font-size: 1.7em; color: var(--navy); margin: 0 0 10px; font-weight: 700; }
  .stage { display:flex; flex-direction: column; gap: 6px; align-items: center; direction: ltr; }
  svg.graph { width: min(96vw, 1180px); height: auto; flex: none; }
  .tablebox { flex: none; direction: ltr; }
  table { border-collapse: collapse; font-size: 1.7em; }
  th, td { border: 1.5px solid var(--navy); min-width: 96px; height: 68px; text-align: center; padding: 0 10px; }
  th { background: #eaf0f7; color: var(--navy); font-weight: 600; }
  th.rowh { text-align: center; }
  td.v { font-size: 1.2em; font-weight: 600; }
  td .choice { display:block; font-size: 0.6em; color: var(--muted); line-height: 1; margin-top: 2px; }
  td.cur { background: var(--gold-bg); box-shadow: inset 0 0 0 3px var(--gold); }
  td.onpath { background: #f7e3e3; box-shadow: inset 0 0 0 3px var(--red); }
  td.star { background: #fff; }
  .m { direction: ltr; unicode-bidi: isolate; font-family: Georgia, "Times New Roman", serif; font-style: italic; }
  .m sub { font-style: normal; font-size: 0.75em; }
  .caption { margin-top: 12px; min-height: 48px; font-size: 1.7em; line-height: 1.5; text-align: center; }
  .formula { direction: ltr; unicode-bidi: isolate; display: inline-block; font-family: Georgia, "Times New Roman", serif; font-size: 1.15em; color: var(--navy); }
  .formula sub { font-size: 0.75em; }
  .bar { margin-top: 10px; display:flex; gap: 18px; align-items:center; justify-content:center; direction: ltr; }
  button { font: inherit; font-size: 1.8em; line-height: 1; width: 72px; height: 56px; border: 2px solid var(--navy); background:#fff; color: var(--navy); border-radius: 10px; cursor: pointer; }
  button:hover { background:#eaf0f7; }
  .count { color: var(--muted); font-size: 1.1em; min-width: 60px; text-align:center; }
  /* svg element states */
  .edge { stroke: var(--navy); stroke-width: 2.2; fill: none; }
  .edge.dim { stroke: var(--gray); }
  .edge.cand { stroke: var(--gold); stroke-width: 5; }
  .edge.chosen { stroke: var(--gold); stroke-width: 4; }
  .edge.path { stroke: var(--red); stroke-width: 5.5; }
  .elabel { font-size: 18px; fill: var(--navy); font-family: Georgia, serif; font-weight: 600; paint-order: stroke; stroke: #fff; stroke-width: 4px; }
  .elabel.cand, .elabel.chosen { fill: #8a6d1d; font-weight: bold; }
  .elabel.path { fill: var(--red); font-weight: bold; }
  .elabel.dim { fill: #9aa3ad; }
  .node { fill:#fff; stroke: var(--navy); stroke-width: 2.6; }
  .node.cur { fill: var(--gold-bg); stroke: var(--gold); stroke-width: 3.5; }
  .node.path { stroke: var(--red); stroke-width: 3.5; }
  .nlabel { font-size: 19px; font-family: Georgia, serif; font-style: italic; fill: var(--ink); }
  .nlabel.small { font-size: 15px; fill: var(--navy); }
  .nval { font-size: 21px; font-weight: bold; fill: var(--ink); font-family: Georgia, serif; }
  .nval.path { fill: var(--red); }
  .badge { fill: var(--gold-bg); stroke: var(--gold); stroke-width: 1.6; }
  .badge.path { fill: #f7e3e3; stroke: var(--red); }
  .btext { font-size: 15px; font-weight: bold; fill: var(--ink); font-family: Georgia, serif; }
  .hidden { display: none; }
  .toggle { margin-inline-start: 28px; display:flex; align-items:center; }
  .toggle input { position:absolute; opacity:0; width:0; height:0; }
  .toggle .pen { font-size: 1.8em; line-height: 1; width: 72px; height: 56px; border: 2px solid var(--navy); background:#fff; color: var(--navy); border-radius: 10px; cursor: pointer; display:flex; align-items:center; justify-content:center; user-select:none; }
  .toggle input:checked + .pen { background: var(--navy); color: #fff; }
  .toggle input:focus-visible + .pen { outline: 2px solid var(--gold); }
  .row { display:flex; flex-direction: row; align-items: center; gap: 40px; direction: ltr; }
  .legend { direction: rtl; display:flex; flex-direction: column; gap: 18px; font-size: 1.45em; color: var(--navy); width: 300px; }
  .legend span { display:flex; align-items:center; gap: 12px; }
  .legend .sw { display:inline-block; width: 40px; height: 30px; border-radius: 4px; box-sizing: border-box; flex: none; }
  .legend .sw.cur { background: var(--gold-bg); border: 2px solid var(--gold); }
  .legend .sw.path { background: #f7e3e3; border: 2px solid var(--red); }
</style>
</head>
<body>
<h1>תכנון דינמי לניתוב משימות: מילוי הטבלה וחילוץ המסלול</h1>

<div class="stage">
  <svg class="graph" viewBox="0 0 720 300" direction="ltr" xmlns="http://www.w3.org/2000/svg" id="graph">
    <defs>
      <marker id="arN" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="4" markerHeight="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0L10 5L0 10z" fill="#16325c"/></marker>
      <marker id="arG" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="3" markerHeight="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0L10 5L0 10z" fill="#c8a44d"/></marker>
      <marker id="arR" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="3" markerHeight="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0L10 5L0 10z" fill="#b23b3b"/></marker>
      <marker id="arD" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="4" markerHeight="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0L10 5L0 10z" fill="#c9ccd1"/></marker>
    </defs>
    <g id="edges"></g>
    <g id="nodes"></g>
    <g id="badges"></g>
  </svg>

  <div class="row">
  <div class="legend"><span><i class="sw cur"></i>התא שממלאים</span><span><i class="sw path"></i>המסלול שמחלצים</span></div>
  <div class="tablebox">
    <table id="tbl">
      <thead><tr><th></th><th><span class="m">p<sup>*</sup></span></th><th><span class="m">k</span>=1</th><th><span class="m">k</span>=2</th><th><span class="m">k</span>=3</th><th><span class="m">k</span>=4</th></tr></thead>
      <tbody>
        <tr><th class="rowh"><span class="m">p<sub>u</sub>[k]</span></th><td class="v star" id="c-s" rowspan="2"></td><td class="v" id="c-u1"></td><td class="v" id="c-u2"></td><td class="v" id="c-u3"></td><td class="v" id="c-u4"></td></tr>
        <tr><th class="rowh"><span class="m">p<sub>d</sub>[k]</span></th><td class="v" id="c-d1"></td><td class="v" id="c-d2"></td><td class="v" id="c-d3"></td><td class="v" id="c-d4"></td></tr>
      </tbody>
    </table>
  </div>
  </div>
</div>

<div class="caption" id="caption"></div>

<div class="bar">
  <button id="reset" title="התחלה">↺</button>
  <button id="prev" title="הקודם">←</button>
  <span class="count" id="count"></span>
  <button id="next" title="הבא">→</button>
  <label class="toggle" title="זוכרים את הבחירה"><input type="checkbox" id="remember"><span class="pen">✎</span></label>
</div>

<script>
(function(){
  // ---------- instance ----------
  const n = 5;
  const x = {1:4, 2:3, 3:5, 4:2, 5:3};   // stay on the upper line: u_{k-1} -> u_k (u_0 = s, u_n = f)
  const y = {1:2, 2:5, 3:2, 4:6, 5:1};   // stay on the lower line
  const a = {2:2, 3:2, 4:5};             // go down:  u_{k-1} -> d_k
  const b = {2:3, 3:1, 4:5};             // go up:    d_{k-1} -> u_k

  // ---------- geometry ----------
  const colX = {1:180, 2:320, 3:460, 4:600};
  const pos = { s:[40,150], f:[680,150] };
  for (let k=1;k<=4;k++){ pos['u'+k]=[colX[k],70]; pos['d'+k]=[colX[k],230]; }
  const R = 31;

  // edges: id -> {from,to,label,w}
  const edges = {};
  function addEdge(from,to,label,w){ edges[from+'-'+to] = {from,to,label,w}; }
  addEdge('s','u1', 'x1', x[1]); addEdge('s','d1','y1', y[1]);
  for (let k=1;k<=3;k++){
    addEdge('u'+k,'u'+(k+1),'x'+(k+1),x[k+1]);
    addEdge('d'+k,'d'+(k+1),'y'+(k+1),y[k+1]);
    addEdge('u'+k,'d'+(k+1),'a'+(k+1),a[k+1]);
    addEdge('d'+k,'u'+(k+1),'b'+(k+1),b[k+1]);
  }
  addEdge('u4','f','x5',x[5]); addEdge('d4','f','y5',y[5]);

  // ---------- draw static graph ----------
  const NS='http://www.w3.org/2000/svg';
  function el(tag,attrs,parent){ const e=document.createElementNS(NS,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); parent.appendChild(e); return e; }
  const gE=document.getElementById('edges'), gN=document.getElementById('nodes'), gB=document.getElementById('badges');
  const edgeEls={}, labelEls={}, nodeEls={}, badgeEls={};
  for (const id in edges){
    const e=edges[id]; const [x1,y1]=pos[e.from], [x2,y2]=pos[e.to];
    const dx=x2-x1, dy=y2-y1, L=Math.hypot(dx,dy), ux=dx/L, uy=dy/L;
    const sx=x1+ux*R, sy=y1+uy*R, ex=x2-ux*(R+2), ey=y2-uy*(R+2);
    edgeEls[id]=el('line',{x1:sx,y1:sy,x2:ex,y2:ey,'class':'edge','marker-end':'url(#arN)'},gE);
    // label: straight edges at midpoint offset outward; cross edges near their start
    let t = (e.from==='s'||e.to==='f') ? 0.5 : (dy===0 ? 0.5 : 0.28);
    let lx=sx+(ex-sx)*t, ly=sy+(ey-sy)*t;
    let off = 14;
    if (dy===0) ly += (y1<150 ? -off : off+4);
    else if (e.from==='s') { lx += 0; ly += (dy<0 ? -off : off+4); }
    else if (e.to==='f') { ly += (dy>0 ? -off : off+4); }
    else { lx += (dy>0 ? 14 : 14); ly += (dy>0 ? -4 : 8); }
    const tx=el('text',{x:lx,y:ly,'text-anchor':'middle','class':'elabel'},gE);
    tx.textContent = e.w;
    labelEls[id]=tx;
  }
  for (const id in pos){
    const [cx,cy]=pos[id];
    nodeEls[id]=el('circle',{cx,cy,r:R,'class':'node'},gN);
    const t=el('text',{x:cx,y:cy-9,'text-anchor':'middle','class':'nlabel small'},gN);
    t.innerHTML = id.length===1 ? id : id[0]+'<tspan font-size="12" dy="4">'+id.slice(1)+'</tspan>';
    const v=el('text',{x:cx,y:cy+19,'text-anchor':'middle','class':'nval hidden'},gB);
    badgeEls[id]={label:t,text:v,cy};
  }

  // ---------- helpers for captions ----------
  const M = s => '<span class="m">'+s+'</span>';
  const sub = (v,i) => v+'<sub>'+i+'</sub>';
  const pu = k => 'p<sub>u</sub>['+k+']', pd = k => 'p<sub>d</sub>['+k+']';
  const nodeName = id => id.length===1 ? id : sub(id[0],id.slice(1));
  const arrow = {stay:'→', down:'↘', up:'↗'};

  // ---------- build steps (full snapshots) ----------
  const steps=[];
  const state = { cand:[], chosen:{}, dim:[], values:{}, choice:{}, cur:null, path:[], pathNodes:[], caption:'', formula:'', curCell:null, pathCells:[] };
  function snap(caption, formula){ const s=JSON.parse(JSON.stringify(state)); s.caption=caption; s.formula=formula||''; steps.push(s); }

  snap('הקלט: גרף פסי ייצור עם ארבע עמודות תחנות (' + M('n') + ' = 5) ומחירים על הקשתות. הטבלה ריקה. ממלאים אותה <b>מימין לשמאל</b>, החל מתנאי הבסיס בעמודה ' + M('k') + ' = 4.');

  // base cases
  state.cur='u4'; state.cand=['u4-f']; state.curCell='u4';
  snap('תנאי בסיס: מ-' + M(nodeName('u4')) + ' יש קשת יחידה ל-' + M('f') + '. אין מה לבחור.', pu(4)+' = '+x[5]);
  state.values.u4=x[5]; state.chosen['u4-f']=true; state.cand=[]; state.choice.u4='stay';
  state.cur='d4'; state.cand=['d4-f']; state.curCell='d4';
  snap('וכך גם מ-' + M(nodeName('d4')) + '.', pd(4)+' = '+y[5]);
  state.values.d4=y[5]; state.chosen['d4-f']=true; state.cand=[]; state.choice.d4='stay';
  state.cur=null; state.curCell=null;

  const val = {u:{4:x[5]}, d:{4:y[5]}};
  for (let k=3;k>=1;k--){
    // upper
    let c1=x[k+1]+val.u[k+1], c2=a[k+1]+val.d[k+1];
    state.cur='u'+k; state.curCell='u'+k; state.cand=['u'+k+'-u'+(k+1),'u'+k+'-d'+(k+1)];
    snap('מחשבים את ' + M(pu(k)) + ': מ-' + M(nodeName('u'+k)) + ' שתי אפשרויות, להישאר למעלה או לרדת, ומשם המחיר <b>כבר חושב</b> (העמודה ' + M('k') + ' = ' + (k+1) + ').',
         pu(k)+' = min('+x[k+1]+' + '+val.u[k+1]+',  '+a[k+1]+' + '+val.d[k+1]+') = min('+c1+', '+c2+')');
    let v=Math.min(c1,c2), ch = c1<c2 ? 'stay':'down';
    val.u[k]=v; state.values['u'+k]=v; state.choice['u'+k]=ch; state.cand=[];
    state.chosen['u'+k+'-'+(ch==='stay'?'u':'d')+(k+1)]=true;
    snap('המינימום הוא ' + v + ', כלומר ' + (ch==='stay'?'להישאר למעלה':'לרדת') + '. כותבים ' + v + ' בטבלה <b>וזוכרים את הבחירה</b> (' + arrow[ch] + ').',
         pu(k)+' = '+v);
    // lower
    c1=y[k+1]+val.d[k+1]; c2=b[k+1]+val.u[k+1];
    state.cur='d'+k; state.curCell='d'+k; state.cand=['d'+k+'-d'+(k+1),'d'+k+'-u'+(k+1)];
    snap('מחשבים את ' + M(pd(k)) + ': מ-' + M(nodeName('d'+k)) + ' להישאר למטה או לעלות.',
         pd(k)+' = min('+y[k+1]+' + '+val.d[k+1]+',  '+b[k+1]+' + '+val.u[k+1]+') = min('+c1+', '+c2+')');
    v=Math.min(c1,c2); ch = c1<c2 ? 'stay':'up';
    val.d[k]=v; state.values['d'+k]=v; state.choice['d'+k]=ch; state.cand=[];
    state.chosen['d'+k+'-'+(ch==='stay'?'d':'u')+(k+1)]=true;
    snap('המינימום הוא ' + v + ', כלומר ' + (ch==='stay'?'להישאר למטה':'לעלות') + '. כותבים ' + v + ' וזוכרים (' + arrow[ch] + ').',
         pd(k)+' = '+v);
  }
  // p*
  let c1=x[1]+val.u[1], c2=y[1]+val.d[1];
  state.cur='s'; state.curCell='s'; state.cand=['s-u1','s-d1'];
  snap('לבסוף ' + M('p<sup>*</sup>') + ': ההחלטה הראשונה מ-' + M('s') + '.',
       'p<sup>*</sup> = min('+x[1]+' + '+val.u[1]+',  '+y[1]+' + '+val.d[1]+') = min('+c1+', '+c2+')');
  const pstar=Math.min(c1,c2), sch = c1<c2 ? 'u':'d';
  state.values.s=pstar; state.choice.s = sch==='u'?'up':'down'; state.cand=[]; state.chosen['s-'+sch+'1']=true;
  state.cur=null; state.curCell=null;
  snap('הטבלה מלאה: המחיר המינימלי הוא ' + M('p<sup>*</sup>') + ' = ' + pstar + '. זמן ריצה: ' + (2*(n-1)+1) + ' תאים, ' + M('O(1)') + ' לכל תא. בכל קודקוד נשארה קשת זהב אחת: הבחירה שנשמרה.',
       'p<sup>*</sup> = '+pstar);

  // reconstruction
  const tableDone = steps.length-1;
  snap('<b>חילוץ הפתרון.</b> הטבלה נתנה את המחיר, לא את המסלול. מתחילים ב-' + M('s') + ' ועוקבים אחרי הבחירות השמורות, קשת אחת בכל צעד.');
  let node='s', acc=0; const names=['s']; const costs=[];
  state.pathNodes=['s'];
  while (node!=='f'){
    const ch=state.choice[node];
    let next;
    if (node==='s') next = ch==='up' ? 'u1' : 'd1';
    else { const k=parseInt(node.slice(1)); const row=node[0]; const other = row==='u'?'d':'u'; next = (k===4) ? 'f' : ((ch==='stay'?row:other)+(k+1)); }
    const eid=node+'-'+next; const w=edges[eid].w; acc+=w; costs.push(w); names.push(next);
    state.path.push(eid); state.pathNodes.push(next); state.pathCells.push(node);
    const what = node==='s' ? (ch==='up'?'לעלות':'לרדת') : (ch==='stay' ? 'להישאר' : (ch==='up'?'לעלות':'לרדת'));
    snap('ב-' + M(nodeName(node)) + ' הבחירה השמורה היא ' + what + ' (' + arrow[ch] + '): הולכים ל-' + M(nodeName(next)) + ' במחיר ' + w + '. מצטבר: ' + acc + '.', costs.join(' + ') + ' = ' + acc);
    node=next;
  }
  snap('המסלול האופטימלי: ' + M(names.map(nodeName).join(' → ')) + ', מחיר כולל ' + costs.join(' + ') + ' = ' + acc + ' = ' + M('p<sup>*</sup>') + '. החילוץ עלה ' + M('O(n)') + ' צעדים נוספים.', costs.join(' + ') + ' = ' + acc + ' = p<sup>*</sup>');

  // ---------- render ----------
  let i=0;
  function render(){
    const s=steps[i]; const rem=document.getElementById('remember').checked;
    for (const id in edgeEls){
      const e=edgeEls[id], l=labelEls[id]; let cls='edge', lcls='elabel', mk='url(#arN)';
      if (s.path.indexOf(id)>=0){ cls+=' path'; lcls+=' path'; mk='url(#arR)'; }
      else if (s.cand.indexOf(id)>=0){ cls+=' cand'; lcls+=' cand'; mk='url(#arG)'; }
      else if (s.chosen[id] && rem){ cls+=' chosen'; lcls+=' chosen'; mk='url(#arG)'; }
      else if (s.values[edges[id].from]!==undefined){ cls+=' dim'; lcls+=' dim'; mk='url(#arD)'; }
      e.setAttribute('class',cls); e.setAttribute('marker-end',mk); l.setAttribute('class',lcls);
    }
    for (const id in nodeEls){
      let cls='node';
      if (s.pathNodes.indexOf(id)>=0) cls+=' path'; else if (s.cur===id) cls+=' cur';
      nodeEls[id].setAttribute('class',cls);
      const b=badgeEls[id];
      if (s.values[id]!==undefined){
        b.text.textContent=s.values[id]; b.text.setAttribute('class','nval'+(s.pathNodes.indexOf(id)>=0?' path':''));
      } else { b.text.setAttribute('class','nval hidden'); }
    }
    for (const id of ['s','u1','u2','u3','u4','d1','d2','d3','d4']){
      const c=document.getElementById('c-'+id); let cls='v'+(id==='s'?' star':'');
      if (s.pathCells.indexOf(id)>=0) cls+=' onpath'; else if (s.curCell===id) cls+=' cur';
      c.setAttribute('class',cls);
      if (s.values[id]!==undefined) c.innerHTML = s.values[id] + (rem ? '<span class="choice">' + (id==='s' ? arrow[s.choice.s] : (id[1]==='4' ? '→' : arrow[s.choice[id]])) + '</span>' : '');
      else c.innerHTML='';
    }
    document.getElementById('caption').innerHTML = s.formula ? '<span class="formula">'+s.formula+'</span>' : '';
    document.getElementById('count').textContent = (i+1)+' / '+(rem ? steps.length : tableDone+1);
    location.replace('#step='+i);
  }
  function last(){ return document.getElementById('remember').checked ? steps.length-1 : tableDone; }
  function go(j){ i=Math.max(0,Math.min(last(),j)); render(); }
  document.getElementById('remember').onchange=()=>go(i);
  // buttons drop focus after a click, so a later key press never re-fires the button
  // (a focused ↺ would otherwise restart on Enter/Space; a focused checkbox would toggle)
  function btn(id,f){ const b=document.getElementById(id); b.onclick=()=>{ f(); b.blur(); }; }
  btn('next',()=>go(i+1)); btn('prev',()=>go(i-1)); btn('reset',()=>go(0));
  document.getElementById('remember').addEventListener('change',ev=>ev.target.blur());
  window.addEventListener('keydown',ev=>{
    if (ev.metaKey||ev.ctrlKey||ev.altKey) return;
    const k=ev.key;
    if (k==='ArrowRight'||k==='ArrowDown'||k===' '||k==='Enter'||k==='PageDown'){ ev.preventDefault(); ev.stopPropagation(); go(i+1); }
    else if (k==='ArrowLeft'||k==='ArrowUp'||k==='Backspace'||k==='PageUp'){ ev.preventDefault(); ev.stopPropagation(); go(i-1); }
    else if (k==='Home'){ ev.preventDefault(); go(0); } else if (k==='End'){ ev.preventDefault(); go(last()); }
  }, true);
  const m=location.hash.match(/step=(\d+)/); go(m?parseInt(m[1]):0);
})();
</script>
